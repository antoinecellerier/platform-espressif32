; PlatformIO Project Configuration File

[env:esp32c6]
platform = espressif32
framework = arduino
board = esp32-c6-devkitc-1
monitor_speed = 115200

; ULP configs trigger lib recompilation with LP-Core loader functions
; (ulp_lp_core_load_binary, ulp_lp_core_run) and correct memory.ld
custom_sdkconfig =
    CONFIG_ULP_COPROC_ENABLED=y
    CONFIG_ULP_COPROC_TYPE_LP_CORE=y
    CONFIG_ULP_COPROC_RESERVE_MEM=8192

; Remove components that break lib recompilation
custom_component_remove =
    espressif/esp_insights
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_diag_data_store
    espressif/esp_diagnostics

; Exclude Arduino wrapper libraries for removed components
lib_ignore = RainMaker, Insights
